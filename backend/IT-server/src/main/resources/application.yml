spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 500MB      # 单个文件最大大小
      max-request-size: 500MB   # 整个请求的最大大小（适用于多文件上传）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    type: com.alibaba.druid.pool.DruidDataSource

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}
      password: ${SPRING_REDIS_PASSWORD}
      database: ${SPRING_REDIS_DATABASE:0}
      timeout: 5000ms
  #      开启数字转成字符串，避免前端js的long类型精度异常
  jackson:
    generator:
      write-numbers-as-strings: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus # 暴露这些端点
  prometheus:
    metrics:
      export:
        enabled: true
        pushgateway:
          enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted # 逻辑删除的数据库字段名，与表中保持一致
      logic-not-delete-value: 0      # 未删除字段的默认值 (例如：0, false, null)
      logic-delete-value: 1         # 已删除字段的值 (例如：1, true)
xiaoyan:
  alioss:
    endpoint: ${OSS_ENDPOINT}
    access_key_id: ${OSSACCESS_KEY_ID}
    access_key_secret: ${OSS_KEY_SECRET}
    bucket_name: ${OSS_BUCKET_NAME}
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    token-name: ${JWT_TOKEN_NAME}
    ttl: ${JWT_TTL}
  admit-urls:
    - "/user/users/login"
    - "/user/resources/all"
    - "/v3/api-docs/**"
    - "/user/newcomers"
    - "/user/articles/page"
    - "/user/articles/count"
    - "/ws/**"